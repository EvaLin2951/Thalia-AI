<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Thalia</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    :root {
      --purple: #6a1b9a;
      --purple-light: #a65cc3;
      --purple-bg: #f5f0f8;
      --blue-accent: #2ba4e0;
      --ink: #2f2a3a;
      --ink-muted: #5e566b;
      --surface: #ffffff;
      --border: #e8e4ee;
      --shadow: rgba(106, 27, 154, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #fef5fb 0%, #f0f8fc 100%);
      min-height: 100vh;
      display: flex;
      color: var(--ink);
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100vh;
      background: white;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 0;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 0 20px;
      margin-bottom: 32px;
    }

    .sidebar-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--purple);
      font-family: 'Arial Narrow', Arial, sans-serif;
      letter-spacing: 0.5px;
    }

    .sidebar-nav {
      flex: 1;
    }

    .nav-item {
      padding: 12px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      color: var(--ink-muted);
      border-left: 3px solid transparent;
      text-decoration: none;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      flex-shrink: 0;
    }

    .nav-item:hover {
      background: var(--purple-bg);
      color: var(--purple);
    }

    .nav-item.active {
      background: var(--purple-bg);
      color: var(--purple);
      border-left-color: var(--purple);
      font-weight: 600;
    }

    .user-info {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .user-info:hover {
      background: var(--purple-bg);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d946bf, #2ba4e0);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 16px;
    }

    .user-details {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      font-size: 12px;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-container {
      margin-left: 240px;
      padding: 40px;
      overflow-y: auto;
      width: calc(100% - 240px);
      min-height: 100vh;
    }

    /* Page Header */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .page-header-text {
      flex: 1;
    }

    .page-title {
      font-size: 30px;
      font-weight: 700;
      color: var(--purple);
      margin: 0 0 8px 0;
    }

    .page-subtitle {
      font-size: 15px;
      font-weight: 400;
      color: var(--ink-muted);
      margin: 0;
    }

    .log-button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #d946bf, #2ba4e0);
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(217, 70, 191, 0.3);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .log-button svg {
      width: 18px;
      height: 18px;
    }

    .log-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(217, 70, 191, 0.4);
    }

    .log-button:active {
      transform: translateY(0);
    }

    /* MRS Assessment Card Styles */
    .mrs-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 12px var(--shadow);
      margin-bottom: 24px;
    }

    /* Header section - title and date */
    .mrs-header-section {
      margin-bottom: 24px;
    }

    /* Horizontal layout: circular progress | spacer | buttons */
    .mrs-content-wrapper {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    /* Circular Progress Section - Full circle with rounded ends */
    .mrs-circular-progress {
      flex-shrink: 0;
      width: 140px;
      height: 140px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SVG circle progress */
    .mrs-progress-svg {
      position: absolute;
      width: 140px;
      height: 140px;
      transform: rotate(-90deg);
    }

    .mrs-progress-circle-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 10;
    }

    .mrs-progress-circle {
      fill: none;
      stroke: url(#mrs-gradient);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease;
    }

    /* Center content (score + severity pill) */
    .mrs-progress-center {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mrs-score-fraction {
      font-size: 32px;
      font-weight: 700;
      color: var(--purple);
      line-height: 1;
    }

    .mrs-score-denominator {
      font-size: 20px;
      font-weight: 500;
      color: var(--ink-muted);
    }

    .mrs-severity-pill {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .mrs-severity-pill.mild {
      background: #D1FAE5;
      color: #065F46;
    }

    .mrs-severity-pill.moderate {
      background: #FEF3C7;
      color: #92400E;
    }

    .mrs-severity-pill.severe {
      background: #FFE0E6;
      color: #C41E3A;
    }

    /* Middle content section */
    .mrs-info-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mrs-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
    }

    .mrs-completed-date {
      font-size: 14px;
      color: var(--ink-muted);
    }

    /* Buttons section */
    .mrs-buttons {
      flex-shrink: 0;
      display: flex;
      gap: 12px;
    }

    .mrs-buttons button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .mrs-buttons .btn-primary {
      background: var(--purple);
      color: white;
    }

    .mrs-buttons .btn-primary:hover {
      background: var(--purple-light);
      transform: translateY(-1px);
    }

    .mrs-buttons .btn-secondary {
      background: var(--purple-bg);
      color: var(--purple);
    }

    .mrs-buttons .btn-secondary:hover {
      background: var(--border);
    }

    /* New user welcome */
    .mrs-welcome {
      padding: 20px;
      background: var(--purple-bg);
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .mrs-welcome p {
      color: var(--ink-muted);
      line-height: 1.6;
      margin: 0;
    }

    .mrs-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .mrs-actions button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mrs-actions .btn-primary {
      background: var(--purple);
      color: white;
    }

    .mrs-actions .btn-primary:hover {
      background: var(--purple-light);
      transform: translateY(-1px);
    }

    /* MRS Modal Styles */
    .mrs-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .mrs-modal.active {
      display: flex;
    }

    .mrs-modal iframe {
      width: 90%;
      max-width: 800px;
      height: 90%;
      border: none;
      border-radius: 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px var(--shadow);
      margin-bottom: 24px;
    }

    .card-header {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .card-header-text {
      flex: 1;
    }

    .card-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 14px;
      color: var(--ink-muted);
    }

    .card-icon {
      font-size: 24px;
    }

    .controls-section {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-bottom: 20px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 10px;
      align-items: start;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      height: 34px;
      line-height: 1;
    }

    /* View Selector Buttons */
    .view-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .view-btn {
      padding: 8px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .view-btn:hover {
      border-color: var(--purple-light);
      background: var(--purple-bg);
    }

    .view-btn.active {
      background: var(--purple);
      color: white;
      border-color: var(--purple);
    }

    /* Navigation Control - Positioned below chart */
    .navigation-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
      padding: 12px;
    }

    .nav-arrow {
      background: none;
      border: none;
      color: var(--ink-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
      font-weight: 600;
    }

    .nav-arrow:hover:not(:disabled) {
      color: var(--purple);
    }

    .nav-arrow:disabled {
      color: #d0d0d0;
      cursor: not-allowed;
    }

    .nav-date-range {
      font-size: 13px;
      color: var(--ink-muted);
      min-width: 280px;
      text-align: center;
      font-weight: 500;
    }

    .symptom-selection {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .symptom-category {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .symptom-category-title {
      font-size: 13px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      min-width: 120px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      height: 34px;
      line-height: 1;
    }

    .symptom-category-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      flex: 1;
    }

    .symptom-pills {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .symptom-pill {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid var(--border);
      background: white;
      color: var(--ink-muted);
      position: relative;
    }

    .symptom-pill.selected {
      background: var(--purple);
      color: white;
      border-color: var(--purple);
    }

    .symptom-pill.highlighted {
      box-shadow: 0 0 0 3px rgba(106, 27, 154, 0.3);
      transform: translateY(-2px);
    }

    .symptom-pill:hover {
      transform: translateY(-2px);
      box-shadow: 0 2px 8px var(--shadow);
    }

    .symptom-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
    }

    .badge-event {
      background: #ffe0e6;
      color: #c41e3a;
    }

    .badge-daily {
      background: #e0f2fe;
      color: #0369a1;
    }

    .badge-weekly {
      background: #f0e7ff;
      color: #7c3aed;
    }

    .symptom-actions {
      display: flex;
      gap: 12px;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--purple);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s;
    }

    .link-btn:hover {
      color: var(--purple-light);
    }

    .chart-container {
      position: relative;
      height: 450px;
      margin-top: 20px;
    }

    .chart-info {
      font-size: 12px;
      color: var(--ink-muted);
      text-align: center;
      margin-top: 12px;
      padding: 8px;
      background: var(--purple-bg);
      border-radius: 6px;
    }

    .chart-info strong {
      color: var(--purple);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 80px 20px;
    }

    .empty-icon {
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
    }

    .empty-icon svg {
      width: 64px;
      height: 64px;
      stroke: #9ca3af;
      fill: none;
      stroke-width: 2;
      display: block;
    }

    .empty-text {
      font-size: 16px;
      font-weight: 400;
      color: #9ca3af;
      line-height: 1.6;
      text-align: center;
    }

    .insight-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 24px;
    }

    .insight-card {
      background: var(--purple-bg);
      border-radius: 12px;
      padding: 24px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
    }

    .insight-card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--purple);
      margin-bottom: 16px;
    }

    .insight-card-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      font-size: 14px;
    }

    @media (max-width: 1024px) {
      .control-row {
        grid-template-columns: 1fr;
      }

      .insight-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-title">THALIA</div>
    </div>
    <nav class="sidebar-nav">
      <a href="logs.html" class="nav-item">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
        Journal
      </a>
      <a href="dashboard.html" class="nav-item active">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        Dashboard
      </a>
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        Companion
      </a>
    </nav>
    <div class="user-info" id="userInfo">
      <div class="user-avatar">U</div>
      <div class="user-details">
        <div class="user-name">User</div>
        <div class="user-email">user@example.com</div>
      </div>
    </div>
  </div>

  <div class="main-container">
    <div class="page-header">
      <div class="page-header-text">
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">View trends and insights</p>
      </div>
      <button class="log-button" onclick="downloadReport()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download Report
      </button>
    </div>

    <!-- MRS Assessment Card -->
    <div class="mrs-card" id="mrsCard">
      <div id="mrsContent">
        <!-- Content will be loaded dynamically -->
      </div>
    </div>

    <!-- MRS Questionnaire Modal -->
    <div class="mrs-modal" id="mrsModal">
      <iframe id="mrsFrame" src=""></iframe>
    </div>

    <div class="card">
      <div class="controls-section">
        <!-- View Selector Control -->
        <div class="control-row">
          <div class="control-label">Time Scale</div>
          <div class="view-buttons">
            <button class="view-btn active" data-view="week">Week</button>
            <button class="view-btn" data-view="month">Month</button>
            <button class="view-btn" data-view="6months">6 Months</button>
            <button class="view-btn" data-view="year">Year</button>
          </div>
        </div>

        <!-- MRS Baseline Toggle -->
        <div class="control-row">
          <div class="control-label">
            <label style="display: flex; align-items: center; cursor: pointer;">
              <input type="checkbox" id="mrsBaselineToggle" checked onchange="toggleMRSBaseline()"
                     style="margin-right: 8px; cursor: pointer;">
              <span>Show MRS Baseline</span>
            </label>
          </div>
        </div>

        <!-- Symptom Selection Control -->
        <div class="control-row">
          <div class="control-label">Symptoms</div>
          <div class="symptom-selection">
            <div class="symptom-pills" id="symptomPills"></div>
            <div class="symptom-actions">
              <button class="link-btn" onclick="selectAllSymptoms()">Select All</button>
              <button class="link-btn" onclick="clearAllSymptoms()">Clear</button>
            </div>
          </div>
        </div>
      </div>

      <div class="chart-container">
        <canvas id="trendChart"></canvas>
        <div class="empty-state" id="chartEmptyState" style="display: none;">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <div class="empty-text">No symptoms selected</div>
        </div>
      </div>

      <!-- Navigation Control -->
      <div class="navigation-control">
        <button class="nav-arrow" id="prevPeriod" onclick="navigatePeriod(-1)">&lt;</button>
        <div class="nav-date-range" id="dateRangeDisplay">Loading...</div>
        <button class="nav-arrow" id="nextPeriod" onclick="navigatePeriod(1)">&gt;</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== Configuration ====================
    
    const SYMPTOM_CONFIG = {
      somatic: [
        { id: 'hot_flashes', name: 'Hot Flashes / Sweating', type: 'event' },
        { id: 'heart_discomfort', name: 'Heart Discomfort', type: 'event' },
        { id: 'sleep_problems', name: 'Sleep Problems', type: 'daily' },
        { id: 'joint_pain', name: 'Joint / Muscular Discomfort', type: 'daily' }
      ],
      psychological: [
        { id: 'depressive_mood', name: 'Depressive Mood', type: 'daily' },
        { id: 'irritability', name: 'Irritability', type: 'daily' },
        { id: 'anxiety', name: 'Anxiety', type: 'daily' },
        { id: 'exhaustion', name: 'Physical / Mental Exhaustion', type: 'daily' }
      ],
      urogenital: [
        { id: 'bladder_problems', name: 'Bladder Problems', type: 'event' },
        { id: 'sexual_problems', name: 'Sexual Problems', type: 'weekly' },
        { id: 'vaginal_dryness', name: 'Vaginal Dryness', type: 'weekly' }
      ]
    };

    const ALL_SYMPTOMS = [
      ...SYMPTOM_CONFIG.somatic,
      ...SYMPTOM_CONFIG.psychological,
      ...SYMPTOM_CONFIG.urogenital
    ];

    // MRS Question to Symptom ID mapping
    const MRS_TO_SYMPTOM = {
      'q1': 'hot_flashes',          // Hot Flashes / Sweating
      'q2': 'heart_discomfort',     // Heart Discomfort
      'q3': 'sleep_problems',       // Sleep Problems
      'q4': 'depressive_mood',      // Depressive Mood
      'q5': 'irritability',         // Irritability
      'q6': 'anxiety',              // Anxiety
      'q7': 'exhaustion',           // Physical / Mental Exhaustion
      'q8': 'sexual_problems',      // Sexual Problems
      'q9': 'bladder_problems',     // Bladder Problems
      'q10': 'vaginal_dryness',     // Vaginal Dryness
      'q11': 'joint_pain'           // Joint / Muscular Pain
    };

    // ==================== State ====================

    const DATA_VERSION = '1.2'; // Increment this to force data regeneration
    let dailyLogs = [];
    let selectedSymptoms = new Set();
    let currentView = 'week'; // week | month | 6months | year
    let currentPeriodStart = null; // Date object for period start
    let currentPeriodEnd = null;   // Date object for period end
    let trendChart = null;
    let mrsBaseline = null; // Store MRS baseline assessment data
    let showMRSBaseline = true; // Toggle for showing/hiding MRS reference lines

    // ==================== Mock Data Generation ====================
    
    function generateMockData() {
      const logs = [];
      const today = new Date();

      // Generate data for past 120 days
      for (let i = 0; i < 120; i++) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];

        // Process all symptoms by type
        ALL_SYMPTOMS.forEach(symptom => {
          if (symptom.type === 'event') {
            // Always generate data (100% chance) for more consistent testing
            logs.push({
              date: dateStr,
              symptom_id: symptom.id,
              symptom_name: symptom.name,
              type: 'event',
              d_evt_count: Math.floor(Math.random() * 5),
              d_evt_sev_max: Math.floor(Math.random() * 5),
              d_sev: null,
              w_anchor_sev: null
            });
          } else if (symptom.type === 'daily') {
            // Always generate data (100% chance) for more consistent testing
            logs.push({
              date: dateStr,
              symptom_id: symptom.id,
              symptom_name: symptom.name,
              type: 'daily',
              d_evt_count: null,
              d_evt_sev_max: null,
              d_sev: Math.floor(Math.random() * 5),
              w_anchor_sev: null
            });
          }
        });
      }

      // Weekly diary symptoms - can be recorded on any day of the week
      for (let i = 0; i < 120; i += 7) {
        const weekStart = new Date(today);
        weekStart.setDate(weekStart.getDate() - i);

        // Align to Monday
        const dayOfWeek = weekStart.getDay();
        const offsetToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        weekStart.setDate(weekStart.getDate() + offsetToMonday);

        ALL_SYMPTOMS.forEach(symptom => {
          if (symptom.type === 'weekly') {
            // 80% chance to generate data for testing
            if (Math.random() > 0.2) {
              // Randomly select a day within the week (0-6: Monday to Sunday)
              const recordDayOffset = Math.floor(Math.random() * 7);
              const recordDate = new Date(weekStart);
              recordDate.setDate(recordDate.getDate() + recordDayOffset);

              if (recordDate <= today) {
                logs.push({
                  date: recordDate.toISOString().split('T')[0],
                  symptom_id: symptom.id,
                  symptom_name: symptom.name,
                  type: 'weekly',
                  d_evt_count: null,
                  d_evt_sev_max: null,
                  d_sev: null,
                  w_anchor_sev: Math.floor(Math.random() * 4) + 1
                });
              }
            }
          }
        });
      }

      return logs;
    }

    // ==================== Week Range Calculation ====================

    function getWeekRange(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      const dayOfWeek = date.getDay();
      const offsetToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;

      const weekStart = new Date(date);
      weekStart.setDate(weekStart.getDate() + offsetToMonday);

      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);

      return {
        start: weekStart.toISOString().split('T')[0],
        end: weekEnd.toISOString().split('T')[0]
      };
    }

    // ==================== Burden Calculation ====================
    
    function calculateSymptomBurden(logs, symptomId, symptomType, weeks = 4) {
      const endDate = new Date();
      const startDate = new Date();
      startDate.setDate(startDate.getDate() - (weeks * 7));
      
      const relevantLogs = logs.filter(log => {
        const logDate = new Date(log.date);
        return log.symptom_id === symptomId && logDate >= startDate && logDate <= endDate;
      });
      
      if (symptomType === 'event') {
        // Event type burden: Σ d_evt_count
        return relevantLogs.reduce((sum, log) => sum + (log.d_evt_count || 0), 0);
      } else if (symptomType === 'daily') {
        // Daily diary burden: Σ d_sev
        return relevantLogs.reduce((sum, log) => sum + (log.d_sev || 0), 0);
      } else if (symptomType === 'weekly') {
        // Weekly diary burden: Σ (w_anchor_sev × days_covered_w)
        // days_covered_w = 7 for weekly symptoms
        return relevantLogs.reduce((sum, log) => sum + ((log.w_anchor_sev || 0) * 7), 0);
      }
      
      return 0;
    }

    function getTop3Symptoms(logs) {
      const burdens = ALL_SYMPTOMS.map(symptom => ({
        ...symptom,
        burden: calculateSymptomBurden(logs, symptom.id, symptom.type)
      }));
      
      // Sort by burden descending and take top 3
      burdens.sort((a, b) => b.burden - a.burden);
      return burdens.slice(0, 3).map(s => s.id);
    }

    // ==================== Period Calculation ====================

    function calculatePeriod(referenceDate) {
      const date = new Date(referenceDate);

      switch(currentView) {
        case 'week':
          // Find the Monday of the week containing referenceDate
          const dayOfWeek = date.getDay();
          const daysFromMonday = (dayOfWeek === 0) ? 6 : dayOfWeek - 1; // If Sunday, go back 6 days
          const monday = new Date(date);
          monday.setDate(monday.getDate() - daysFromMonday);
          currentPeriodStart = new Date(monday);
          currentPeriodStart.setHours(0, 0, 0, 0);

          currentPeriodEnd = new Date(monday);
          currentPeriodEnd.setDate(currentPeriodEnd.getDate() + 6);
          currentPeriodEnd.setHours(23, 59, 59, 999);
          break;

        case 'month':
          // First day of the month
          currentPeriodStart = new Date(date.getFullYear(), date.getMonth(), 1);
          currentPeriodStart.setHours(0, 0, 0, 0);

          // Last day of the month
          currentPeriodEnd = new Date(date.getFullYear(), date.getMonth() + 1, 0);
          currentPeriodEnd.setHours(23, 59, 59, 999);
          break;

        case '6months':
          // Past 6 complete months from current month
          // If today is Nov 2025, show Jun-Nov 2025
          const endMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0); // Last day of current month
          const startMonth = new Date(date.getFullYear(), date.getMonth() - 5, 1); // First day of 6 months ago

          currentPeriodStart = startMonth;
          currentPeriodStart.setHours(0, 0, 0, 0);
          currentPeriodEnd = endMonth;
          currentPeriodEnd.setHours(23, 59, 59, 999);
          break;

        case 'year':
          // Full calendar year
          currentPeriodStart = new Date(date.getFullYear(), 0, 1);
          currentPeriodStart.setHours(0, 0, 0, 0);

          currentPeriodEnd = new Date(date.getFullYear(), 11, 31);
          currentPeriodEnd.setHours(23, 59, 59, 999);
          break;
      }
    }

    function switchView(newView) {
      currentView = newView;
      updateViewButtonsUI();

      // Always reset to current period containing today when switching views
      calculatePeriod(new Date());

      // Save preference
      localStorage.setItem('currentView', currentView);

      updateNavigationUI();
      updateChart();
    }

    function navigatePeriod(direction) {
      // direction: -1 for previous, +1 for next

      if (currentView === '6months') {
        // For 6 months view, directly shift the window by 6 months
        const newStart = new Date(currentPeriodStart);
        newStart.setMonth(newStart.getMonth() + (direction * 6));

        const newEnd = new Date(currentPeriodEnd);
        newEnd.setMonth(newEnd.getMonth() + (direction * 6));

        currentPeriodStart = newStart;
        currentPeriodEnd = newEnd;
      } else {
        // For other views, use calculatePeriod
        let newDate;

        switch(currentView) {
          case 'week':
            newDate = new Date(currentPeriodStart);
            newDate.setDate(newDate.getDate() + (direction * 7));
            break;

          case 'month':
            newDate = new Date(currentPeriodStart);
            newDate.setMonth(newDate.getMonth() + direction);
            break;

          case 'year':
            newDate = new Date(currentPeriodStart);
            newDate.setFullYear(newDate.getFullYear() + direction);
            break;
        }

        calculatePeriod(newDate);
      }

      updateNavigationUI();
      updateChart();
    }

    function updateNavigationUI() {
      // Update date range display
      const dateRangeDisplay = document.getElementById('dateRangeDisplay');
      dateRangeDisplay.textContent = formatPeriodRange();

      // Update button states
      const prevBtn = document.getElementById('prevPeriod');
      const nextBtn = document.getElementById('nextPeriod');

      // Previous button is always enabled (we have historical data)
      prevBtn.disabled = false;

      // Next button: disable if next period would be in the future
      const nextPeriodInFuture = willNextPeriodBeInFuture();
      nextBtn.disabled = nextPeriodInFuture;
    }

    function willNextPeriodBeInFuture() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      // Calculate what the next period's start would be
      let nextPeriodStart;

      switch(currentView) {
        case 'week':
          nextPeriodStart = new Date(currentPeriodStart);
          nextPeriodStart.setDate(nextPeriodStart.getDate() + 7);
          break;

        case 'month':
          nextPeriodStart = new Date(currentPeriodStart);
          nextPeriodStart.setMonth(nextPeriodStart.getMonth() + 1);
          break;

        case '6months':
          nextPeriodStart = new Date(currentPeriodStart);
          nextPeriodStart.setMonth(nextPeriodStart.getMonth() + 6);
          break;

        case 'year':
          nextPeriodStart = new Date(currentPeriodStart);
          nextPeriodStart.setFullYear(nextPeriodStart.getFullYear() + 1);
          break;
      }

      return nextPeriodStart > today;
    }

    function formatPeriodRange() {
      const months = ['January', 'February', 'March', 'April', 'May', 'June',
                     'July', 'August', 'September', 'October', 'November', 'December'];

      switch(currentView) {
        case 'week':
          // Format: "November 3 - 9, 2025" or "October 30 - November 5, 2025"
          const startMonth = months[currentPeriodStart.getMonth()];
          const endMonth = months[currentPeriodEnd.getMonth()];
          const startDay = currentPeriodStart.getDate();
          const endDay = currentPeriodEnd.getDate();
          const year = currentPeriodEnd.getFullYear();

          if (startMonth === endMonth) {
            return `${startMonth} ${startDay} - ${endDay}, ${year}`;
          } else {
            return `${startMonth} ${startDay} - ${endMonth} ${endDay}, ${year}`;
          }

        case 'month':
          // Format: "November 2025"
          return `${months[currentPeriodStart.getMonth()]} ${currentPeriodStart.getFullYear()}`;

        case '6months':
          // Format: "June - November 2025" or "October 2024 - March 2025"
          const start6Month = months[currentPeriodStart.getMonth()];
          const end6Month = months[currentPeriodEnd.getMonth()];
          const startYear = currentPeriodStart.getFullYear();
          const endYear = currentPeriodEnd.getFullYear();

          if (startYear === endYear) {
            return `${start6Month} - ${end6Month} ${endYear}`;
          } else {
            return `${start6Month} ${startYear} - ${end6Month} ${endYear}`;
          }

        case 'year':
          return currentPeriodStart.getFullYear().toString();
      }
    }

    // ==================== Data Loading ====================

    function formatDateLocal(date) {
      // Use local timezone instead of UTC to avoid date boundary issues
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    async function loadData() {
      const userId = getCurrentUserId();

      if (!userId) {
        console.error('No user logged in, redirecting to login...');
        window.location.href = 'login.html';
        return;
      }

      try {
        // Calculate date range (past 120 days)
        const endDate = new Date();
        const startDate = new Date();
        startDate.setDate(endDate.getDate() - 120);

        // Call backend API to get logs
        const response = await fetch('/api/get_logs', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            user_id: userId,
            start_date: formatDateLocal(startDate),
            end_date: formatDateLocal(endDate)
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        dailyLogs = data.logs || [];

        console.log(`✅ Loaded ${dailyLogs.length} symptom log entries from backend`);

        // Select top 3 by burden as default
        const top3 = getTop3Symptoms(dailyLogs);
        selectedSymptoms = new Set(top3);

        updateSymptomPillsUI();
        updateChart();

        // Load MRS status
        await loadMRSStatus();

        // Load user info display
        loadUserInfo();

      } catch (error) {
        console.error('Error loading data from backend:', error);
        // Fallback to empty data or show error message
        dailyLogs = [];
        alert('Failed to load symptom data. Please try refreshing the page.');
      }
    }

    // ==================== MRS Assessment ====================

    async function loadMRSStatus() {
      const userId = getCurrentUserId();

      if (!userId) {
        return;
      }

      try {
        const response = await fetch('/api/get_mrs_history', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ user_id: userId })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        const assessments = data.assessments || [];

        if (assessments.length === 0) {
          // New user, no baseline
          mrsBaseline = null;
          renderNewUserMRS();
        } else {
          // Has baseline, show status
          const latest = assessments[assessments.length - 1];
          mrsBaseline = latest; // Store for chart reference lines
          renderMRSStatus(latest);
        }

      } catch (error) {
        console.error('Error loading MRS status:', error);
        document.getElementById('mrsContent').innerHTML = '<p style="color: var(--ink-muted);">Failed to load MRS assessment status.</p>';
      }

    function renderMRSStatus(assessment) {

      const progressPercent = (totalScore / 44) * 100;

    // Listen for MRS submission
    window.addEventListener('message', async (event) => {
      if (event.data.type === 'MRS_SUBMIT') {
        try {
          const userId = getCurrentUserId();

          // Save assessment to backend
          const response = await fetch('/api/save_mrs_assessment', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              user_id: userId,
              ...event.data.data

    // ==================== Download Report ====================

    async function downloadReport() {
      try {
        // Check if user is logged in
        const userId = getCurrentUserId();
        if (!userId) {
          alert('Please log in to download report');
          return;
        }

        // Check if there's chart data
        if (!trendChart || selectedSymptoms.size === 0) {
          alert('Please select symptoms to include in the report');
          return;
        }

        // Export chart as base64 image
        const chartImage = trendChart.toBase64Image('image/png', 1);

        // Collect selected symptoms names
        const selectedSymptomsData = Array.from(selectedSymptoms).map(id => {
          const symptomInfo = ALL_SYMPTOMS.find(s => s.id === id);
          return {
            id: id,
            name: symptomInfo ? symptomInfo.name : id
          };
        });

        // Prepare request data
        const requestData = {
          user_id: userId,
          chart_image: chartImage,
          mrs_baseline: mrsBaseline,
          selected_symptoms: selectedSymptomsData,
          date_range: {
            start: currentPeriodStart.toISOString().split('T')[0],
            end: currentPeriodEnd.toISOString().split('T')[0],
            view: currentView
          }
        };

        // Call backend API
        const response = await fetch('/api/generate_comprehensive_report', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestData)
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        // Download the PDF
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Thalia_Report_${new Date().toISOString().split('T')[0]}.pdf`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);

        console.log('✅ Report downloaded successfully');

      } catch (error) {
        console.error('Error generating report:', error);
        alert('Failed to generate report. Please try again.');

      // Generate data for every 7 days (weekly) across the 6-month period
      // Start from the first Monday in or before the period
      let firstMonday = new Date(currentPeriodStart);
      const dayOfWeekStart = firstMonday.getDay();
      const offsetToMonday = dayOfWeekStart === 0 ? -6 : 1 - dayOfWeekStart;
      firstMonday.setDate(firstMonday.getDate() + offsetToMonday);

      for (let windowStart = new Date(firstMonday); windowStart <= currentPeriodEnd; windowStart.setDate(windowStart.getDate() + 7)) {
        const windowEnd = new Date(windowStart);
        windowEnd.setDate(windowEnd.getDate() + 6); // 7-day window (Monday to Sunday)

        // Clamp window end to period end
        const actualEnd = windowEnd > currentPeriodEnd ? currentPeriodEnd : windowEnd;

        // Create label: Monday's date "Nov 4", "Nov 11", etc.
        const monthNamesShort = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const labelDate = new Date(windowStart);
        labels.push(`${monthNamesShort[labelDate.getMonth()]} ${labelDate.getDate()}`);

        const startMonth = monthNamesShort[windowStart.getMonth()];

        const startDay = windowStart.getDate();
        const endDay = actualEnd.getDate();
        const year = actualEnd.getFullYear();

        let dateRangeStr;
        if (startMonth === endMonth) {
          dateRangeStr = `Week: ${startMonth} ${startDay} - ${endDay}, ${year}`;
        } else {
          dateRangeStr = `Week: ${startMonth} ${startDay} - ${endMonth} ${endDay}, ${year}`;

        dateRanges.push(dateRangeStr);

        // Check if window contains future dates
        const windowInFuture = windowStart > today;

        selectedSymptomsData.forEach(symptom => {
          const windowStartStr = windowStart.toISOString().split('T')[0];
          const windowEndStr = actualEnd.toISOString().split('T')[0];

          const windowLogs = logs.filter(l => {
            return l.date >= windowStartStr && l.date <= windowEndStr && l.symptom_id === symptom.id;
          });

          if (symptom.type === 'event') {
            const countDataset = datasets.find(d => d.symptomId === symptom.id && d.dataType === 'count');
            const sevDataset = datasets.find(d => d.symptomId === symptom.id && d.dataType === 'severity');

            if (windowInFuture || windowLogs.length === 0) {
              countDataset.data.push(null);
              sevDataset.data.push(null);
            } else {
              // Average daily count across the window
              const totalCount = windowLogs.reduce((sum, l) => sum + (l.d_evt_count || 0), 0);
              countDataset.data.push(totalCount / windowLogs.length);

              // Average severity across the window
              const totalSev = windowLogs.reduce((sum, l) => sum + (l.d_evt_sev_max || 0), 0);
              sevDataset.data.push(totalSev / windowLogs.length);
            }
          } else if (symptom.type === 'daily') {
            const dataset = datasets.find(d => d.symptomId === symptom.id);

            if (windowInFuture || windowLogs.length === 0) {
              dataset.data.push(null);
            } else {
              // Average severity across the window
              const totalSev = windowLogs.reduce((sum, l) => sum + (l.d_sev || 0), 0);
              dataset.data.push(totalSev / windowLogs.length);
            }
          } else if (symptom.type === 'weekly') {
            const dataset = datasets.find(d => d.symptomId === symptom.id);

            // For weekly symptoms, there should be at most one record per week
            if (windowInFuture || windowLogs.length === 0) {
              dataset.data.push(null);
            } else {
              // Take the w_anchor_sev value (should be only one per week)
              const weekLog = windowLogs[0];
              dataset.data.push(weekLog.w_anchor_sev || 0);
            }
          }
        });
      }

      return { labels, datasets, dateRanges };

    }


    // ==================== Chart Rendering ====================

    function getMRSAnnotations() {
      // Return empty annotations if toggle is off or no MRS baseline data
      if (!showMRSBaseline || !mrsBaseline || !mrsBaseline.answers) {
        return {};
      }

      const annotations = {};

      // For each selected symptom, add MRS baseline reference line
      selectedSymptoms.forEach(symptomId => {
        // Find corresponding MRS question
        const mrsQuestion = Object.keys(MRS_TO_SYMPTOM).find(q => MRS_TO_SYMPTOM[q] === symptomId);

        if (mrsQuestion && mrsBaseline.answers[mrsQuestion] !== undefined) {
          const mrsScore = mrsBaseline.answers[mrsQuestion];

          // Only show annotation for non-zero scores
          if (mrsScore > 0) {
            const symptomInfo = ALL_SYMPTOMS.find(s => s.id === symptomId);
            const symptomName = symptomInfo ? symptomInfo.name : symptomId;

            annotations[`mrs_${symptomId}`] = {
              type: 'line',
              yMin: mrsScore,
              yMax: mrsScore,
              yScaleID: 'ySev',  // Use severity scale
              borderColor: getColor(symptomId, 0.5),
              borderWidth: 2,
              borderDash: [5, 5],  // Dashed line
              label: {
                display: true,
                content: `MRS: ${mrsScore}`,
                position: 'end',
                backgroundColor: getColor(symptomId, 0.8),
                color: 'white',
                font: {
                  size: 10,
                  weight: 'bold'
                },
                padding: 4
              }
            };
          }
        }
      });

      return annotations;
    }

    function renderChart(chartData) {
      const canvas = document.getElementById('trendChart');
      const emptyState = document.getElementById('chartEmptyState');

      // Show canvas and hide empty state
      if (canvas) canvas.style.display = 'block';
      if (emptyState) emptyState.style.display = 'none';

      const ctx = canvas.getContext('2d');

      if (trendChart) {
        trendChart.destroy();
      }

      trendChart = new Chart(ctx, {
        type: 'bar',
        data: chartData,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: {
                padding: 15,
                usePointStyle: true,
                font: {
                  size: 12,
                  weight: '600'
                }
              }
            },
            tooltip: {
              callbacks: {
                title: function(context) {
                  const index = context[0].dataIndex;

                  // Use custom date formats based on view
                  if (currentView === '6months' && chartData.dateRanges) {
                    return chartData.dateRanges[index] || context[0].label;
                  } else if (chartData.tooltipDates) {
                    return chartData.tooltipDates[index] || context[0].label;
                  }

                  return context[0].label;
                },
                label: function(context) {
                  const value = Math.abs(context.parsed.y);
                  const isCount = context.dataset.yAxisID === 'yCount';
                  if (isCount) {
                    return `${context.dataset.label}: ${value.toFixed(2)} times/day`;
                  } else {
                    return `${context.dataset.label}: ${value.toFixed(2)}/4`;
                  }
                }
              }
            },
            annotation: {
              annotations: getMRSAnnotations()
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: {
                maxRotation: 45,
                minRotation: 45
              }
            },
            yCount: {
              type: 'linear',
              position: 'left',
              min: 0,
              title: {
                display: true,
                text: 'Event Count (times/day)',
                font: {
                  size: 13,
                  weight: '600'
                }
              },
              grid: {
                color: 'rgba(0, 0, 0, 0.05)'
              }
            },
            ySev: {
              type: 'linear',
              position: 'right',
              min: 0,
              max: 4,
              reverse: false,
              title: {
                display: true,
                text: 'Severity Score (0-4)',
                font: {
                  size: 13,
                  weight: '600'
                }
              },
              grid: {
                drawOnChartArea: false
              }
            }
          }
        }
      });
    }

    function showEmptyChart() {
      if (trendChart) {
        trendChart.destroy();
        trendChart = null;
      }

      const canvas = document.getElementById('trendChart');
      const emptyState = document.getElementById('chartEmptyState');

      if (canvas) canvas.style.display = 'none';
      if (emptyState) emptyState.style.display = 'block';
    }

    // ==================== Color Palette ====================
    
    function getColor(symptomId, alpha = 1) {
      const colors = {
        // Event type (red tones)
        'hot_flashes': `rgba(255, 99, 132, ${alpha})`,
        'heart_discomfort': `rgba(255, 159, 64, ${alpha})`,
        'bladder_problems': `rgba(255, 206, 86, ${alpha})`,
        
        // Daily diary (blue tones)
        'sleep_problems': `rgba(54, 162, 235, ${alpha})`,
        'joint_pain': `rgba(75, 192, 192, ${alpha})`,
        'depressive_mood': `rgba(153, 102, 255, ${alpha})`,
        'irritability': `rgba(201, 203, 207, ${alpha})`,
        'anxiety': `rgba(100, 149, 237, ${alpha})`,
        'exhaustion': `rgba(135, 206, 250, ${alpha})`,
        
        // Weekly diary (purple tones)
        'sexual_problems': `rgba(186, 85, 211, ${alpha})`,
        'vaginal_dryness': `rgba(221, 160, 221, ${alpha})`
      };
      
      return colors[symptomId] || `rgba(128, 128, 128, ${alpha})`;
    }

    // ==================== Initialize ====================
    
    window.addEventListener('DOMContentLoaded', initializeUI);
  </script>
</body>
</html>
